name: Deploy

# Manual on purpose. Auto-deploying every push to main is not what you want for a
# single-VPS setup with a destructive migration in the sequence — you want to
# choose the moment. Flip on the `push` trigger below once you trust it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: verify-only
        options:
          - verify-only          # run the post-deploy checks against live, change nothing
          - deploy               # pull, rebuild, restart
      migration:
        description: "Token-expiry migration (deletes expired/legacy rows)"
        type: choice
        default: skip
        options:
          - skip
          - dry-run              # report counts, write nothing
          - apply                # actually migrate
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production       # never two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production      # add required reviewers here to gate it
    steps:
      - uses: actions/checkout@v4

      # ── Pre-flight: what is live right now? ─────────────────────────────────
      - name: Record the current live state
        id: before
        env:
          APP: ${{ vars.APP_URL }}
          API: ${{ vars.API_URL }}
        run: |
          set -uo pipefail
          echo "### Before" >> "$GITHUB_STEP_SUMMARY"
          bundle=$(curl -sS -m 20 "$APP/" | grep -oE 'static/js/[^"]+\.js' | head -1 || true)
          echo "- bundle: \`${bundle:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          # Same artifact-based test as the post-deploy step. Probing
          # /undefined/api/... is useless here: the SPA fallback 200s every
          # unmatched path, so it can never distinguish a good build from a bad one.
          if [ -n "$bundle" ] && ! curl -sS -m 30 "$APP/$bundle" | grep -qF "$API"; then
            echo "- :warning: **the live frontend has no API host — sign-in is broken**" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Reach the server ────────────────────────────────────────────────────
      - name: Set up SSH
        if: inputs.mode == 'deploy'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$KEY"  || { echo "::error::secret DEPLOY_SSH_KEY is not set";  exit 1; }
          test -n "$HOST" || { echo "::error::secret DEPLOY_HOST is not set";     exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          {
            echo "Host target"
            echo "  HostName $HOST"
            echo "  User ${{ secrets.DEPLOY_USER || 'root' }}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          # Hosts behind a Cloudflare tunnel need a service token, not a public IP.
          if [ -n "${CF_ID:-}" ] && [ -n "${CF_SECRET:-}" ]; then
            curl -fsSL -o cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared && sudo mv cloudflared /usr/local/bin/
            echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
            echo "CF_ACCESS_CLIENT_ID=$CF_ID"         >> "$GITHUB_ENV"
            echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"
            echo "using cloudflared tunnel"
          fi
          ssh -o BatchMode=yes target 'echo "ssh ok: $(hostname)"'

      # ── Deploy ──────────────────────────────────────────────────────────────
      - name: Sync, rebuild, restart
        if: inputs.mode == 'deploy'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH" || { echo "::error::secret DEPLOY_PATH is not set"; exit 1; }

          # Ship the runner's checkout rather than pulling on the server. The
          # deploy target is NOT a git working copy (and giving it credentials
          # for a private repo just to read code it was handed is needless), so
          # `git fetch && git reset --hard` there fails outright.
          #
          # --delete matters: it is not tidiness. `git archive`-style copying
          # adds files but never removes them, and the CRA->Vite rename left a
          # stale src/App.js beside the new App.jsx — Vite then tried to parse
          # JSX in a .js and the build died. Deleting removed files prevents that.
          #
          # .env is excluded so the server's real secrets are never touched;
          # they exist only there and are git-ignored.
          rsync -a --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' \
            ./ "target:${DEPLOY_PATH}/"
          echo "synced $(git rev-parse --short HEAD) $(git log -1 --format=%s)"

          # -f compose.yaml is REQUIRED, never a bare `docker compose`. Without
          # it Compose auto-merges any override file and the frontend gets built
          # against a localhost API host with the Traefik network detached.
          #
          # The frontend MUST be rebuilt: the API host is compiled into the
          # bundle. compose.yaml supplies it as a build arg from DOMAIN_NAME,
          # and the Dockerfile refuses to produce a bundle without it.
          ssh -o BatchMode=yes target bash -euo pipefail <<REMOTE
            cd "$DEPLOY_PATH"
            docker compose -f compose.yaml build --pull
            docker compose -f compose.yaml up -d
            docker compose -f compose.yaml ps
          REMOTE

      - name: Verify the shipped bundle on the server
        if: inputs.mode == 'deploy'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes target bash -euo pipefail <<'REMOTE'
            img=$(docker compose -f compose.yaml images -q frontend 2>/dev/null | head -1)
            img=${img:-forge-frontend}
            hosts=$(docker run --rm --entrypoint sh "$img" -c \
              'grep -rho "https://api-[a-z0-9.-]*" /usr/share/nginx/html/static/js | sort -u' || true)
            echo "bundle targets: ${hosts:-NONE}"
            test -n "$hosts" || { echo "::error::shipped bundle contains no API host"; exit 1; }
          REMOTE

      # ── Migration, only if explicitly asked for ─────────────────────────────
      - name: Token-expiry migration
        if: inputs.mode == 'deploy' && inputs.migration != 'skip'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MODE: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          FLAG=""
          [ "$MODE" = "apply" ] && FLAG="--apply"
          ssh -o BatchMode=yes target bash -euo pipefail <<REMOTE | tee migration.log
            cd "$DEPLOY_PATH"
            docker compose -f compose.yaml exec -T backend python migrate_token_expiry.py $FLAG
          REMOTE
          { echo "### Migration (\`$MODE\`)"; echo '```'; cat migration.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ── The check that would have caught the outage ─────────────────────────
      - name: Post-deploy verification
        env:
          APP: ${{ vars.APP_URL }}
          API: ${{ vars.API_URL }}
        run: |
          set -uo pipefail
          fail=0
          echo "### After" >> "$GITHUB_STEP_SUMMARY"

          # Give the containers a moment to come up.
          for i in $(seq 1 20); do
            curl -sSf -m 10 -o /dev/null "$APP/" && break
            sleep 3
          done

          bundle=$(curl -sS -m 20 "$APP/" | grep -oE 'static/js/[^"]+\.js' | head -1 || true)
          echo "- bundle: \`${bundle:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"

          # THE regression check: does the bundle we just shipped actually carry
          # an API host?
          #
          # This used to probe $APP/undefined/api/auth/refresh and demand a 404.
          # That never worked. nginx.conf's SPA entry is
          # `try_files $uri $uri/ /index.html`, a catch-all that answers EVERY
          # unmatched path with the app shell and a 200 — /undefined/api/... ,
          # /total-nonsense-path, all of them. So the probe returned 200 on a
          # healthy deploy and a broken one alike: a constant, not a signal, and
          # it failed 100% of deploys.
          #
          # Assert on the artifact instead. Fetch the shipped bundle and look for
          # the API host positively, plus the negative "undefined/api". Note the
          # negative alone is not enough — a previous toolchain minified the bug
          # to `void 0+"/api"`, which no grep for "undefined/api" would catch.
          if [ -z "$bundle" ]; then
            echo "- :x: could not determine the shipped bundle from index.html" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            js=$(curl -sS -m 30 "$APP/$bundle" || true)
            if printf '%s' "$js" | grep -qF "$API"; then
              echo "- :white_check_mark: bundle targets \`$API\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :x: bundle does NOT contain \`$API\` — it shipped with no API host" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            if printf '%s' "$js" | grep -q "undefined/api"; then
              echo "- :x: bundle contains \`undefined/api\`" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          fi

          # The real backend must answer as itself, not as the SPA.
          ct=$(curl -sS -m 20 -o /dev/null -w '%{content_type}' -X POST "$API/api/auth/refresh" || echo none)
          case "$ct" in
            application/json*) echo "- :white_check_mark: API returns JSON" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "- :x: API returned \`$ct\`, expected JSON" >> "$GITHUB_STEP_SUMMARY"; fail=1 ;;
          esac

          # index.html must never be cached, or a deploy strands old bundle hashes.
          cc=$(curl -sSI -m 20 "$APP/" | tr -d '\r' | grep -i '^cache-control' || true)
          case "$cc" in
            *no-store*|*no-cache*) echo "- :white_check_mark: shell not cached" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "- :warning: shell cache-control: \`${cc:-absent}\`" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

          exit $fail

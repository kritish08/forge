server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ── Compression ──────────────────────────────────────────────────────────
    # The stock nginx:alpine image ships with gzip commented out, so without this
    # block every JS/CSS byte goes over the wire raw. Text assets typically
    # compress 3-4x, which is the single largest transfer win available here.
    # (Brotli would compress ~15% better still, but ngx_brotli is not compiled
    # into the official image — that needs a custom base and is a separate job.)
    gzip on;
    gzip_vary on;                 # vary on Accept-Encoding so caches stay correct
    gzip_comp_level 6;            # past ~6 the CPU cost outruns the size win
    gzip_min_length 1024;         # below this the framing overhead isn't worth it
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    # text/html is always compressed when gzip is on; listing it is an error.

    # Serve a precompressed .gz next to the original when one exists. A no-op
    # today (nothing precompresses at build time) but free, and it makes adding
    # a build-time compression step a one-line change later.
    gzip_static on;

    # ── Assets ───────────────────────────────────────────────────────────────
    # Hashed build assets (main.<hash>.js/css, media). Content-addressed, so cache
    # them aggressively — but a MISSING asset must return a real 404, never the
    # SPA's index.html. Serving HTML for a stale /static/*.js (with nosniff) is what
    # breaks the app after a deploy that changes bundle hashes.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The service worker must never be cached, or a broken or superseded worker
    # stays installed on returning visitors until its own update check happens.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ── SPA entry ────────────────────────────────────────────────────────────
    # SPA entry point and client-side routes. Never cache index.html, so a new
    # deploy's bundle references are picked up on the next load (no hard refresh).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

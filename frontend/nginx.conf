server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets (main.<hash>.js/css, media). Content-addressed, so cache
    # them aggressively — but a MISSING asset must return a real 404, never the
    # SPA's index.html. Serving HTML for a stale /static/*.js (with nosniff) is what
    # breaks the app after a deploy that changes bundle hashes.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA entry point and client-side routes. Never cache index.html, so a new
    # deploy's bundle references are picked up on the next load (no hard refresh).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

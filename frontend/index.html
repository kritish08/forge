<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#F97316" />
        <meta name="description" content="FORGE - The consistency tracker that learns you. Consistency forged in fire." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="FORGE" />
        <!-- Applies the saved theme BEFORE first paint. Without this the class is
             only set in ThemeProvider's useEffect, which runs after the first
             render, so every cold load flashed the light theme at dark-mode users.
             Keep the storage key and the 'system' default in sync with
             src/context/ThemeContext.js. -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("forge-theme") || "system";
                    var dark =
                        saved === "dark" ||
                        (saved === "system" &&
                            window.matchMedia("(prefers-color-scheme: dark)").matches);
                    var root = document.documentElement;
                    root.classList.add(dark ? "dark" : "light");
                    // Also tells the browser which palette to use for the canvas,
                    // form controls and scrollbars before any CSS has loaded.
                    root.style.colorScheme = dark ? "dark" : "light";
                } catch (e) {
                    /* private mode / storage blocked — fall through to light */
                }
            })();
        </script>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/favicon.svg" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <!-- Open Graph -->
        <meta property="og:title" content="FORGE — Consistency Forged in Fire" />
        <meta property="og:description" content="AI-powered habit tracker that learns your patterns and gives you insights no generic app can. Stop tracking habits. Start understanding them." />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="FORGE — Consistency Forged in Fire" />
        <meta name="twitter:description" content="AI-powered habit intelligence. Your patterns. Your data. Your insights." />
        <title>FORGE — Consistency Forged in Fire</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
